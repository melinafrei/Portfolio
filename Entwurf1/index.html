<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
	   <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./style2.css" />

    <title>Melina Frei</title>
    <meta name="description" content="Portfolio von Melina Frei" />
</head>

<body>
    <main class="raster" id="startseiten-raster" aria-label="Raster mit zehn Spalten">
        <div class="raster__spalte" id="spalte-1"><img src="data/Semantische_Typografie-5.jpg" alt=""><span class="raster__projekt-titel">Semantische Typografie</span><button class="raster__pfeil raster__pfeil--rechts" type="button" aria-label="Zur zehnten Spalte springen">→</button></div>
        <div class="raster__spalte"><img src="data/Layout_1-11.jpg" alt=""><span class="raster__projekt-titel">Zeitlose Klassiker</span></div>
        <div class="raster__spalte"><img src="data/Layout_2-12.jpg" alt=""><span class="raster__projekt-titel">24 Stunden</span></div>
        <div class="raster__spalte"><img src="data/Typo-2.jpg" alt=""><span class="raster__projekt-titel">Impro Bzez</span></div>
        <div class="raster__spalte"><img src="data/Paris_Vorprojekt-10.jpg" alt=""><span class="raster__projekt-titel">Hesch du das scho ghört?</span></div>
        <div class="raster__spalte"><img src="data/cup.jpg" alt=""><span class="raster__projekt-titel">Heat – Sip of Flavour</span></div>
        <div class="raster__spalte"><video src="data/Motion_Graphics_AE-1.mp4" autoplay muted loop playsinline></video><span class="raster__projekt-titel">Schweben</span></div>
        <div class="raster__spalte"><img src="data/Mockup_Blickwechsel.jpg" alt=""><span class="raster__projekt-titel">Einzigartigkeit</span></div>
        <div class="raster__spalte"><img src="data/Mockup_Konzerte.jpg" alt=""><span class="raster__projekt-titel">Masterabschluss Konzerte</span></div>
        <div class="raster__spalte" id="spalte-10" role="button" tabindex="0" aria-label="London-Projekt vergrössern"><img src="data/London_Projekt-24.jpg" alt=""><span class="raster__projekt-titel">Just Around the Corner</span><button class="raster__pfeil raster__pfeil--links" type="button" aria-label="Zur ersten Spalte springen">←</button></div>
    </main>
    <h1 class="startseite-titel">Projekte</h1>
    <p class="startseite-name">Melina Frei</p>
    <p class="startseite-ueber">Über mich</p>
    <div class="start-scrollbar" role="scrollbar" aria-label="Startseite horizontal scrollen" aria-controls="startseiten-raster" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <span class="start-scrollbar__thumb"></span>
    </div>
    <dialog class="projekt-overlay" aria-label="London-Projekt">
        <button class="projekt-overlay__schliessen" type="button" aria-label="Overlay schliessen">×</button>
        <div class="overlay-grid" id="overlay-inhalt">
            <div class="overlay-bild-zoom overlay-bild-zoom--start"><img src="data/London_Projekt-24.jpg" alt="London-Projekt"><button class="overlay-pfeil-unten" type="button" aria-label="Zum nächsten Inhalt scrollen"></button></div>
            <p class="projekt-text"><span>Just Around</span><span>the corner</span></p>
            <div class="overlay-bild-zoom nebeneinander"><img src="data/London_Projekt-5.jpg" alt="London-Projekt"></div>
            <div class="overlay-bild-zoom nebeneinander"><img src="data/London_Projekt-16.jpg" alt="London-Projekt"></div>
            <div class="overlay-bild-zoom"><img src="data/London_Projekt-19.jpg" alt="London-Projekt"></div>
            <div class="overlay-bild-zoom nebeneinander"><img src="data/London_Projekt-15.jpg" alt="London-Projekt"></div>
            <div class="overlay-bild-zoom nebeneinander"><img src="data/London_Projekt-6.jpg" alt="London-Projekt"></div>
            <div class="overlay-bild-zoom"><img src="data/London_Projekt-23.jpg" alt="London-Projekt"></div>
            <h2 class="prozess-titel">Prozess</h2>
            <div class="prozess-flaechen" aria-hidden="true">
                <div class="prozess-flaeche prozess-flaeche--links" data-position="links" role="button" tabindex="0" aria-label="Flächen nach links verschieben"></div>
                <div class="prozess-flaeche" data-position="mitte" role="button" tabindex="0" aria-label="Flächen verschieben"></div>
                <div class="prozess-flaeche prozess-flaeche--rechts" data-position="rechts" role="button" tabindex="0" aria-label="Flächen nach rechts verschieben"></div>
                <span class="prozess-pfeil prozess-pfeil--links" aria-hidden="true"></span>
                <span class="prozess-pfeil" aria-hidden="true"></span>
                <button class="prozess-nach-oben" type="button" aria-label="Im Projekt nach oben springen"></button>
                <div class="semantische-link">
                    <span>Semantische Typografie</span>
                    <span class="semantische-pfeil" aria-hidden="true"></span>
                </div>
                <div class="semantische-link masterabschluss-link">
                    <span class="semantische-pfeil semantische-pfeil--links" aria-hidden="true"></span>
                    <span>Master Abschlusskonzerte</span>
                </div>
            </div>
        </div>
        <div class="overlay-scrollbar" role="scrollbar" aria-label="Projekt scrollen" aria-controls="overlay-inhalt" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <span class="overlay-scrollbar__thumb"></span>
        </div>
    </dialog>
</body>

<script src="./script.js"></script>

</html>
